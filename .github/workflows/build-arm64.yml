name: Build Horizon ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  HORIZON_MSA_CLIENT_ID: "c36a9fb6-4f2a-41ff-90bd-ae7cc92031eb"

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            clang \
            lld \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libvulkan-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build ARM64 binaries
        run: |
          cargo build --release \
            --bin horizon-client \
            --bin horizon-server \
            --bin horizon-ctl \
            --bin horizon-prepare

      - name: Build horizon-wasm-std.wasm
        run: |
          cargo run --locked --release -p cargo-horizon-mod -- wasm-std target/release/horizon-wasm-std.wasm

      - name: Upload ARM64 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-arm64
          path: |
            target/release/horizon-client
            target/release/horizon-server
            target/release/horizon-ctl
            target/release/horizon-prepare
            target/release/horizon-wasm-std.wasm
          if-no-files-found: error
